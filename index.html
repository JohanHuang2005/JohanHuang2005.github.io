<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Youhan Huang — Computer Vision & Intelligent Sensing">
  <meta name="author" content="Youhan Huang">
  <title>Youhan Huang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="cover" class="cover">
    <canvas id="background" class="cover-canvas"></canvas>
    <div class="cover-content">
      <p class="cover-kicker" id="cover-kicker">Personal Homepage</p>
      <h1 class="cover-name" id="cover-name">Youhan Huang</h1>
      <p class="cover-tagline" id="cover-tagline">Computer Vision · Intelligent Sensing</p>
      <button type="button" class="cover-enter" id="cover-enter" aria-label="Enter site">Enter</button>
      <div class="cover-links" id="cover-links"></div>
    </div>
  </div>

  <div id="site" class="site" hidden>
    <header class="topbar" id="topbar">
      <a class="topbar-brand" href="#about" id="topbar-brand">Youhan Huang</a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span>
      </button>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
    </header>

    <main id="main" class="main"></main>

    <footer class="footer" id="footer"></footer>
  </div>

  <script>
    // Skip cover + fluid boot on revisit / deep links (before fluid.js).
    window.switchPage = { switched: false };
    try {
      if (sessionStorage.getItem("homepage-entered") === "1" || location.hash) {
        window.switchPage.switched = true;
        document.documentElement.classList.add("skip-cover");
      }
    } catch (e) {}
  </script>
  <script src="/js/fluid.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
