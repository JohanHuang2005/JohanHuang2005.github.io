{% assign links = include.pub.links %}
{% if links.paper or links.project or links.code or links.video %}
<p class="pub-links">
  {% if links.paper %}
  <a href="{{ links.paper }}" target="_blank" rel="noopener">[Paper]</a>
  {% endif %}
  {% if links.project %}
  <a href="{{ links.project }}" target="_blank" rel="noopener">[Project]</a>
  {% endif %}
  {% if links.code %}
  <a href="{{ links.code }}" target="_blank" rel="noopener">[Code]</a>
  {% endif %}
  {% if links.video %}
  <a href="{{ links.video }}" target="_blank" rel="noopener">[Video]</a>
  {% endif %}
</p>
{% endif %}
