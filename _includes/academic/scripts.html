<script>
(function () {
  var STORAGE_THEME = 'academic-theme';
  var STORAGE_LANG = 'academic-lang';
  var bgUrls = [
    {% assign bg_web = "19,20,2,17,16,3" | split: "," %}
    {% for n in bg_web %}
    '{{ "bg/" | append: n | strip | append: ".jpg" | relative_url }}'{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  var html = document.documentElement;
  var bgEl = document.getElementById('panel-left-bg');
  var navBtns = document.querySelectorAll('.sidebar-nav-btn');
  var panels = document.querySelectorAll('.page-panel');
  var btnTheme = document.getElementById('btn-theme');
  var btnLang = document.getElementById('btn-lang');

  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    try { localStorage.setItem(STORAGE_THEME, theme); } catch (e) {}
  }

  function applyLang(lang) {
    html.setAttribute('data-lang', lang);
    html.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
    try { localStorage.setItem(STORAGE_LANG, lang); } catch (e) {}
  }

  function showPage(pageId) {
    panels.forEach(function (panel) {
      var active = panel.dataset.page === pageId;
      panel.classList.toggle('is-active', active);
      panel.hidden = !active;
    });
    navBtns.forEach(function (btn) {
      btn.classList.toggle('is-active', btn.dataset.page === pageId);
    });
  }

  navBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      showPage(btn.dataset.page);
    });
  });

  if (btnTheme) {
    btnTheme.addEventListener('click', function () {
      applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }

  if (btnLang) {
    btnLang.addEventListener('click', function () {
      applyLang(html.getAttribute('data-lang') === 'en' ? 'zh' : 'en');
    });
  }

  function initCarousel() {
    if (!bgEl || !bgUrls.length) return;
    var idx = 0;
    bgEl.style.backgroundImage = 'url(' + bgUrls[0] + ')';

    window.setInterval(function () {
      idx = (idx + 1) % bgUrls.length;
      bgEl.style.opacity = '0.85';
      window.setTimeout(function () {
        bgEl.style.backgroundImage = 'url(' + bgUrls[idx] + ')';
        bgEl.style.opacity = '1';
      }, 400);
    }, 300000);

    window.setTimeout(function () {
      for (var j = 1; j < bgUrls.length; j++) {
        var img = new Image();
        img.src = bgUrls[j];
      }
    }, 3000);
  }

  applyTheme(html.getAttribute('data-theme') || 'light');
  applyLang(html.getAttribute('data-lang') || 'zh');
  initCarousel();
  showPage('home');
})();
</script>
