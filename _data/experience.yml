research:
  - org: 北京大学计算机学院 · 无线感知团队
    role: 科研实习生
    period: 2024 年 8 月 – 2025 年 9 月
    bullets:
      - "面向多毫米波雷达协同感知中的高精度外参标定问题，针对现有方法将人体视作点目标导致的中心估计偏差与俯仰角缺失，参与构建基于椭圆柱人体建模与几何补全的一致轨迹标定方案，实现雷达间相对位姿恢复与俯仰角自标定；参与关键实验设计与结果分析，方法显著降低相对距离与方位角误差，实现厘米级距离误差与稳定角度估计；相关论文已投稿 IEEE TMC（CCF-A）。"
      - "开展基于神经网络的毫米波雷达点云室内物品分类与噪声消除研究，在人、狗、风扇三类目标测试中取得 97% 以上准确率。"

  - org: 北京邮电大学人工智能学院 · 模式识别与智能视觉实验室
    role: 科研实习生
    period: 2025 年 4 月 – 2026 年 3 月
    bullets:
      - "面向透明物体三维重建中反射与折射耦合导致的形状–外观歧义问题，参与基于偏振信息的多视图逆渲染研究；参与构建透明物体重建框架，以隐式几何表示物体形状，引入偏振照明建模与双界面光传输建模，联合估计物体几何与成像过程；参与实验实现、结果分析及论文撰写，方法在合成与真实数据集上均取得优于现有方法的重建效果；一作论文已投稿 ECCV 2026（计算机视觉领域顶会）。"

  - org: 北京邮电大学（小鼠 NAFLD 多任务病理评分）
    role: 项目负责人
    period: 2025 年 10 月 – 2026 年 1 月
    bullets:
      - "面向小鼠 NAFLD 病理评分中脂肪变性、炎症与气球样变性三任务联合评估需求，主导构建并开源多任务病理评分数据集；提出基于 Multi-task ViT 的联合建模方案，引入 task-specific Adapter/LoRA 缓解任务间负迁移，并完成实验设计、模型实现与结果分析；参与论文撰写；共同第一作者（排名第一）论文已被 ICME 2026 (CCF-B) 接收为 Oral（[arXiv:2605.29852](https://arxiv.org/abs/2605.29852)）。"

  - org: 北京邮电大学计算机学院 · 图像美学评估团队
    role: 科研实习生
    period: 2025 年 11 月 – 2026 年 1 月
    bullets:
      - "参与长视频美学评估研究，主要负责实验复现、评测指标计算与结果整理，并协助实验报告整理与论文写作。"

projects:
  - title: "LidarCar：迷宫导航与建图自主移动机器人（C）"
    role: 组长
    bullets:
      - "面向迷宫导航与实时建图场景完成配备 2D 激光雷达的自主移动机器人硬件系统集成；负责激光雷达模块接入、STM32 板块指针分配与调试、蓝牙通信代码开发，并推动传感器、控制与通信链路联调，实现迷宫探索、出口定位与返回起点等核心功能。"
    links:
      code: "https://github.com/JohanHuang2005/LidarCar"

  - title: "国际学院助教招募系统（Java）— EBU6304 软件工程课程项目"
    role: 团队负责人（Group 77）
    bullets:
      - "面向课程组织者、授课教师与研究生助教设计并开发 TA Recruitment System；负责需求分析、迭代规划、系统架构与核心功能实现，基于 Agile 与 GitHub 协作推进职位发布、申请管理、状态跟踪与结果通知等核心流程（JDK 17 + Tomcat 10 + Maven）。"
    links:
      code: "https://github.com/JohanHuang2005/SE_Coursework"
      label: "GitHub"

  - title: "儿童图形化数学学习应用（Java）"
    role: 组织开发
    bullets:
      - "组织开发面向儿童的图形化数学学习应用，采用模块化任务设计与统一导航界面，支持题目训练、进度反馈与积分激励；负责界面联调、集成测试与文档整理，推动多模块稳定集成与交互体验优化。"

  - title: "多媒体基础知识点学习网页（HTML/CSS/JS）"
    role: 团队负责人
    bullets:
      - "围绕多媒体基础知识学习场景设计交互式网页，负责 homepage 信息架构、视觉呈现与前端实现，并统筹页面维护、导航一致性、多终端兼容与基础交互优化。"
