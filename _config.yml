# Setup
title: 黄友涵
description: 黄友涵（Youhan Huang）个人学术主页 — 北京邮电大学电子信息工程本科，研究方向为三维视觉、机器学习与智能感知。
url: https://johanhuang2005.github.io
avatar: /me.jpg
paginate: 5
permalink: pretty
# cover_image: /bg.jpeg  # 注释掉，使用JavaScript动态背景

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-toc

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - EVALUATION.md
  - scripts/
  - not-pure-poole.gemspec
# Optimize Jekyl SEO Tag
twitter:
  username: yourtwitterusername  # 替换为你的Twitter用户名（可选）
  card: summary
logo: logo.png
social:
  name: Youhan Huang  # 替换为你的名字
  links:
    - https://github.com/JohanHuang2005  # 保留你的GitHub链接
google_site_verification: xxxxx  # 如果你有Google验证代码，可以添加
lang: zh-CN

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# google_analytics: UA-000000-0

# Replace this value and uncomment to enable Disqus
# disqus: xxxxxx

# Specify the author for blog posts
author:
  name: 黄友涵
  url: https://github.com/JohanHuang2005/
  email: johanhuang@bupt.edu.cn
